name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax probe
        run: python -B -c "from pathlib import Path; files=['app.py','calculator.py','graphing.py','graph_renderer.py','tools/create_icon.py','tests/test_calculator.py','tests/test_graphing.py','tests/test_graph_renderer.py','tests/test_project_metadata.py','tests/smoke_gui.py']; [compile(Path(f).read_text(encoding='utf-8'), f, 'exec') for f in files]; print('syntax ok')"

      - name: Unit tests
        run: python -B -m unittest discover -s tests -v

  gui-smoke:
    name: Optional GUI smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: GUI smoke
        run: python -B tests/smoke_gui.py

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-artifacts
          path: test-artifacts/

  package-windows:
    name: Optional Windows package
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate icon assets
        run: python tools/create_icon.py

      - name: Build executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name ScientificCalculator --icon assets/app_icon.ico app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ScientificCalculator-windows
          path: dist/ScientificCalculator.exe
